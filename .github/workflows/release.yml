name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
      - '[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Release checks
        run: npm run check:release

      - name: Verify version matches tag
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          TAG_STRIPPED=${TAG#v}
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          if [ "$TAG_STRIPPED" != "$MANIFEST_VERSION" ]; then
            echo "Error: tag $TAG (stripped: $TAG_STRIPPED) does not match manifest.json version $MANIFEST_VERSION"
            exit 1
          fi
          echo "Version match: $TAG_STRIPPED"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            main.js
            styles.css
            manifest.json
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prune old releases (keep 3 latest)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Keep the newest KEEP releases (by semver), delete older ones together
          # with their tags. Runs only after a successful release publish.
          KEEP=3
          echo "Releases before prune:"
          gh release list --limit 100 --json tagName -q '.[].tagName' | sort -V | tee /tmp/releases.txt
          COUNT=$(wc -l < /tmp/releases.txt)
          if [ "$COUNT" -le "$KEEP" ]; then
            echo "Only $COUNT releases — nothing to prune."
            exit 0
          fi
          DELETE=$(head -n $((COUNT - KEEP)) /tmp/releases.txt)
          for TAG in $DELETE; do
            echo "Deleting release + tag: $TAG"
            gh release delete "$TAG" --yes --cleanup-tag || git push origin ":refs/tags/$TAG"
          done
          echo "Releases after prune:"
          gh release list --limit 100
